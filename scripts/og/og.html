html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{background:#0c0c0f;color:#f4f4f5;font-family:BVP,sans-serif;position:relative}
.glow{position:absolute;inset:0;background:radial-gradient(45% 60% at 22% 18%,rgba(140,155,255,.28),transparent 70%),radial-gradient(35% 50% at 85% 10%,rgba(34,211,238,.14),transparent 70%)}

.wrap{position:relative;padding:72px 80px;height:100%;box-sizing:border-box;display:flex;flex-direction:column}
.brand{font-size:34px;font-weight:400;display:flex;gap:14px;align-items:center}
.brand .p{font-family:JBM;color:#8c9bff;font-weight:500}.brand b{font-weight:700}
h1{text-wrap:balance;font-size:64px;line-height:1.08;letter-spacing:-2px;margin:56px 0 22px;font-weight:700;max-width:1060px}
p{font-size:28px;color:#c4c4cb;margin:0;max-width:900px;line-height:1.45}
.foot{margin-top:auto;display:flex;gap:14px;align-items:center;font-size:22px;color:#a1a1aa}
.chip{padding:8px 18px;border-radius:999px;border:1px solid #2a2a31;background:#131317;color:#e4e4e7}
.chip.a{border-color:#3b4280;color:#c9d0ff;background:#1c2149}
