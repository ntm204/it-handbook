<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sổ tay IT</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/themes/vue.css" media="(prefers-color-scheme: light)">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/themes/dark.css" media="(prefers-color-scheme: dark)">
  <style>
    :root { --base-font-size: 15px; }
    .markdown-section { max-width: 920px; }
    .markdown-section table { display: table; width: 100%; }
    .markdown-section td code, .markdown-section p code, .markdown-section li code { white-space: nowrap; }
    .sidebar .app-name-link { font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      .markdown-section tr:nth-child(2n) { background-color: rgba(255,255,255,0.04); }
      .markdown-section td, .markdown-section th { border-color: #4a4a4a; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: "Sổ tay IT",
      loadSidebar: true,
      subMaxLevel: 2,
      auto2top: true,
      homepage: "README.md",
      search: { placeholder: "Tìm lệnh, chủ đề…", noData: "Không tìm thấy", depth: 3 },
      copyCode: { buttonText: "Copy", successText: "Đã copy" },
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@3.0.2/dist/docsify-copy-code.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-bash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-powershell.min.js"></script>
</body>
</html>
